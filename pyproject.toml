[project]
name = "handoff-lab"
version = "0.1.0"
description = "A small coding-agent harness with inspectable traces"
requires-python = ">=3.11"

[project.scripts]
handoff = "handoff_lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["handoff_lab*"]
